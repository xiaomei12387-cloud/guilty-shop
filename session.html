<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GUILTY // PROTOCOL ACTIVE SESSION</title>
  <style>
    :root {
      --accent-cyan: #00ff88;
      --accent-purple: #b5179e;
      --danger-red: #ff334b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.8);
    }
    .info-partner { font-size: 1rem; font-weight: bold; }
    .info-safeword { color: var(--accent-cyan); font-weight: bold; font-size: 1rem; }

    /* 中央極限碼錶 */
    .timer-section {
      text-align: center;
      padding: 10px 0;
    }
    .timer-label {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--accent-cyan);
    }
    #timerDisplay {
      font-size: clamp(3.8rem, 16vw, 7rem);
      font-weight: 900;
      color: var(--accent-cyan);
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
      line-height: 1;
    }

    /* 動態多項目計數網格 */
    .counter-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 0 14px;
      overflow-y: auto;
      max-height: 38vh;
    }
    .counter-card {
      background: #0d0d12;
      border: 2px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.05);
    }
    .counter-card.purple-theme {
      border-color: var(--accent-purple);
      box-shadow: inset 0 0 15px rgba(181, 23, 158, 0.05);
    }
    .counter-top { display: flex; justify-content: space-between; align-items: center; }
    .counter-name { font-size: 0.8rem; color: #8c8f96; font-weight: bold; }
    .counter-num { font-size: 2.4rem; font-weight: 900; line-height: 1; margin: 6px 0; }
    
    .counter-ctrl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ctrl-btn {
      background: #14141a;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-weight: bold;
      padding: 8px 0;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #fff; color: #000; }

    /* 底部超巨型盲按急停板與結案 (佔據 40%+ 面積) */
    .bottom-controls {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .btn-panic-massive {
      width: 100%;
      height: clamp(90px, 16vh, 130px);
      background: #ff334b;
      border: 3px solid #fff;
      color: #fff;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 45px rgba(255, 51, 75, 0.8);
      animation: panicGlow 1.2s infinite alternate;
    }
    @keyframes panicGlow {
      from { box-shadow: 0 0 20px rgba(255, 51, 75, 0.4); transform: scale(1); }
      to { box-shadow: 0 0 55px rgba(255, 51, 75, 1); transform: scale(1.01); }
    }

    .btn-finish {
      width: 100%;
      padding: 12px;
      background: #141418;
      border: 1px solid rgba(255,255,255,0.2);
      color: #a1a1aa;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    #panicOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      border: 10px solid #ff334b;
      z-index: 99999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #panicOverlay.active { display: flex; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-size:0.65rem; color:#8c8f96;">實踐對象</div>
      <div class="info-partner" id="partnerNameDisplay">載入中...</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:0.65rem; color:#8c8f96;">安全詞</div>
      <div class="info-safeword" id="safewordDisplay">MAYDAY</div>
    </div>
  </header>

  <!-- 中央極限碼錶 -->
  <div class="timer-section">
    <div class="timer-label">● SESSION RUNNING</div>
    <div id="timerDisplay">00:00</div>
  </div>

  <!-- 多元動態計數網格（支援 [+1] / [+5]） -->
  <div class="counter-grid" id="sessionCounterGrid"></div>

  <!-- 底部超巨大盲按急停板 -->
  <div class="bottom-controls">
    <button class="btn-panic-massive" onclick="triggerPanic()">
      🛑 SAFEWORD 急停停止
    </button>
    <button class="btn-finish" onclick="finishSession()">
      ■ 正常完成並結案返回
    </button>
  </div>

  <!-- 急停全面封鎖畫面（持續警報與震動） -->
  <div id="panicOverlay">
    <div style="font-size:clamp(1.8rem, 6vw, 2.6rem); color:#ff334b; font-weight:900; letter-spacing:4px; margin-bottom:14px;">
      ⚠️ 急停協議觸發 ⚠️
    </div>
    <div style="font-size:1.1rem; color:#fff; margin-bottom:20px;">
      安全詞：<span id="panicWordText" style="color:#ff334b; font-size:1.8rem; font-weight:bold;">MAYDAY</span>
    </div>
    <div style="max-width:420px; font-size:0.85rem; color:#a1a1aa; line-height:1.7; margin-bottom:26px;">
      警報已鎖定！所有動作即刻停止。解除束縛器具，提供溫水，進行 Aftercare 照護。
    </div>
    <button onclick="dismissAndReturn()" style="padding:16px 36px; background:#fff; color:#000; border:none; font-weight:bold; font-size:1rem; cursor:pointer; border-radius:4px;">
      [ 確認雙方安全 // 解除警報並退出 ]
    </button>
  </div>

  <script>
    let activeKey = null;
    let trackerState = null;
    let activePartner = null;
    let secondsElapsed = 0;
    let timer = null;
    let emergencyInterval = null;

    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("guilty_tracker_")) {
        activeKey = k;
        break;
      }
    }

    if (activeKey) {
      try { trackerState = JSON.parse(localStorage.getItem(activeKey)); } catch(e){}
    }

    if (trackerState && trackerState.partners && trackerState.partners.length > 0) {
      activePartner = trackerState.partners.find(p => p.id === trackerState.activePartnerId) || trackerState.partners[0];
    }

    let sessionMetrics = (activePartner && activePartner.customMetrics) || [
      { id: "sp", name: "SP 掌/板", count: 0, color: "cyan" },
      { id: "whip", name: "長鞭/散鞭", count: 0, color: "purple" },
      { id: "rope", name: "繩縛段數", count: 0, color: "cyan" },
      { id: "wax", name: "低溫滴蠟", count: 0, color: "purple" }
    ];

    document.getElementById("partnerNameDisplay").textContent = activePartner ? activePartner.name : "特工";
    const sWord = (activePartner && activePartner.safeword) ? activePartner.safeword : "MAYDAY";
    document.getElementById("safewordDisplay").textContent = sWord;
    document.getElementById("panicWordText").textContent = sWord.toUpperCase();

    function renderSessionCounters() {
      const grid = document.getElementById("sessionCounterGrid");
      grid.innerHTML = sessionMetrics.map((m, idx) => `
        <div class="counter-card ${m.color === 'purple' ? 'purple-theme' : ''}">
          <div class="counter-top">
            <span class="counter-name">${m.name}</span>
          </div>
          <div class="counter-num" id="metric_val_${idx}" style="color:${m.color==='purple'?'var(--accent-purple)':'var(--accent-cyan)'};">${m.count}</div>
          <div class="counter-ctrl-row">
            <button class="ctrl-btn" onclick="adjustMetric(${idx}, 1)">+1</button>
            <button class="ctrl-btn" onclick="adjustMetric(${idx}, 5)">+5</button>
          </div>
        </div>
      `).join('');
    }
    renderSessionCounters();

    timer = setInterval(() => {
      secondsElapsed++;
      const min = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const sec = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById("timerDisplay").textContent = `${min}:${sec}`;
    }, 1000);

    function playBeep(isEmergency = false) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (isEmergency) {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(650, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
          osc.start(); osc.stop(ctx.currentTime + 0.06);
        }
      } catch (e) {}
    }

    function adjustMetric(index, delta) {
      playBeep(false);
      if (navigator.vibrate) delta > 1 ? navigator.vibrate([30, 40, 30]) : navigator.vibrate(35);
      sessionMetrics[index].count = Math.max(0, sessionMetrics[index].count + delta);
      const el = document.getElementById(`metric_val_${index}`);
      if (el) el.textContent = sessionMetrics[index].count;
    }

    // 🛑 觸發持續急停警報與連續震動
    function triggerPanic() {
      clearInterval(timer);
      document.getElementById("panicOverlay").classList.add("active");

      // 持續發出警報音效與震動迴圈
      playBeep(true);
      if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 800]);

      clearInterval(emergencyInterval);
      emergencyInterval = setInterval(() => {
        playBeep(true);
        if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
      }, 1800);
    }

    function saveSessionRecord(noteText) {
      if (!trackerState || !activePartner) return;
      const mins = Math.floor(secondsElapsed / 60);
      const secs = secondsElapsed % 60;
      const durationStr = `${mins} 分 ${secs} 秒`;
      const summaryText = sessionMetrics.map(m => `${m.name}: ${m.count}`).join(" ｜ ");

      if (!activePartner.sessions) activePartner.sessions = [];
      activePartner.sessions.unshift({
        sessionId: "SES-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString("zh-TW"),
        duration: durationStr,
        durationMins: Math.max(1, mins),
        summary: summaryText,
        note: noteText
      });

      activePartner.customMetrics = sessionMetrics;
      localStorage.setItem(activeKey, JSON.stringify(trackerState));
    }

    function finishSession() {
      clearInterval(timer);
      const note = prompt("請輸入本次實踐結案筆記：", "實踐順利完成，雙方意識清醒。");
      saveSessionRecord(note || "實踐正常完成。");
      window.location.href = "index.html#tracker";
    }

    function dismissAndReturn() {
      clearInterval(emergencyInterval);
      if (navigator.vibrate) navigator.vibrate(0);
      saveSessionRecord("⚠️ 觸發安全詞急停協議退出。");
      window.location.href = "index.html#tracker";
    }
  </script>
</body>
</html>

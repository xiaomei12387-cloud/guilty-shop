<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>欲室｜共犯 GUILTY × shushi束室 繩教室</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: rgba(20, 20, 24, 0.85);
      --panel-border: #262930;
      --accent-cyan: #00ff88;
      --accent-purple: #b5179e;
      --text-main: #f0f0f0;
      --text-muted: #8c8f96;
      --danger-red: #ff334b;
      --glow-cyan: rgba(0, 255, 136, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'PingFang TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; overflow-x: hidden; background: var(--bg-color); color: var(--text-main); line-height: 1.6; }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 8, 10, 0.9);
      position: sticky; top: 0; z-index: 500;
      backdrop-filter: blur(10px);
    }

    .brand-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .header-logo-icon { width: 24px; height: 24px; }
    .user-badge { font-size: 0.75rem; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 4px 8px; cursor: pointer; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    .product-list-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 4px; overflow: hidden; cursor: pointer; }
    .card-thumb { height: 160px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text-muted); }
    .card-body { padding: 16px; }

    /* 表單與會員介面 */
    .form-box { background: var(--card-bg); border: 1px solid var(--panel-border); padding: 20px; border-radius: 4px; margin-bottom: 24px; }
    .form-title { font-size: 1.1rem; color: var(--accent-cyan); margin-bottom: 16px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 12px; background: #000; border: 1px solid var(--panel-border); color: #fff; font-size: 0.9rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent-cyan); }

    .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .radio-card {
      border: 1px solid var(--panel-border); padding: 12px; text-align: center; cursor: pointer; font-size: 0.85rem; background: #0c0c0e;
    }
    .radio-card.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0,255,136,0.05); }

    .btn-submit {
      width: 100%; padding: 16px; background: var(--accent-cyan); color: #000; font-size: 1rem; font-weight: bold; border: none; cursor: pointer; letter-spacing: 2px;
    }
    .btn-submit:hover { background: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand-container" onclick="showView('catalog')">
      <svg class="header-logo-icon" viewBox="0 0 100 100">
        <polygon points="50,5 92,50 50,95 8,50" fill="none" stroke="var(--accent-cyan)" stroke-width="6" />
        <path d="M50,25 Q60,50 50,75 Q40,50 50,25 Z" fill="var(--accent-cyan)" />
      </svg>
      <div style="font-size:0.95rem; font-weight:bold;">欲室｜共犯 <span style="color:var(--accent-cyan)">GUILTY</span></div>
    </div>
    <div class="user-badge" id="memberBtn" onclick="toggleMemberModal()">[ 身份認證：訪客 ]</div>
  </header>

  <div class="container">
    
    <!-- 目錄頁 -->
    <div id="view-catalog" class="view-section active">
      <div style="text-align:center; padding: 20px 0;">
        <h1 style="font-size: 1.6rem;">支配・拘束・義體裝備聯邦</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">欲室共犯自主研發 × shushi束室 繩教室</p>
      </div>
      <div class="product-list-grid" id="productGrid"></div>
    </div>

    <!-- 結帳與協議簽署頁 -->
    <div id="view-checkout" class="view-section">
      <button onclick="showView('catalog')" style="background:transparent; border:1px solid var(--panel-border); color:var(--text-muted); padding:6px 12px; cursor:pointer; margin-bottom:16px;">← 返回裝備目錄</button>
      
      <div class="form-box">
        <div class="form-title">01 // 調用裝備摘要</div>
        <div id="orderSummary" style="font-size: 0.9rem; margin-bottom: 12px;"></div>
      </div>

      <form id="checkoutForm">
        <!-- 會員與收件人資訊 -->
        <div class="form-box">
          <div class="form-title">02 // 嫌疑人 / 收件終端資料</div>
          <div class="form-group">
            <label>配戴者 / 收件人姓名*</label>
            <input type="text" id="custName" required placeholder="真實姓名（超商取貨需核對證件）" />
          </div>
          <div class="form-group">
            <label>聯絡終端（手機號碼）*</label>
            <input type="tel" id="custPhone" required placeholder="0912-345-678" />
          </div>
          <div class="form-group">
            <label>特製金屬銘牌雷雕字樣（限英數 10 字）</label>
            <input type="text" id="custEngraving" maxlength="10" placeholder="例如：GUILTY-01" />
          </div>
        </div>

        <!-- 物流方式 -->
        <div class="form-box">
          <div class="form-title">03 // 物流交付途徑</div>
          <div class="radio-grid" style="margin-bottom: 16px;">
            <div class="radio-card active" onclick="selectShipping('711', this)">7-11 超商取貨</div>
            <div class="radio-card" onclick="selectShipping('family', this)">全家 超商取貨</div>
            <div class="radio-card" onclick="selectShipping('home', this)">黑貓 宅配到府</div>
          </div>
          <div class="form-group" id="storeInputGroup">
            <label id="storeLabel">7-11 門市名稱 / 店號*</label>
            <input type="text" id="shippingLocation" required placeholder="例如：鑫台北門市 / 991182" />
          </div>
        </div>

        <!-- 支付方式 -->
        <div class="form-box">
          <div class="form-title">04 // 支付結算通道</div>
          <div class="radio-grid" style="margin-bottom: 16px;">
            <div class="radio-card active" onclick="selectPayment('cod', this)">超商取貨付款</div>
            <div class="radio-card" onclick="selectPayment('linepay', this)">LINE Pay</div>
            <div class="radio-card" onclick="selectPayment('card', this)">信用卡線上刷卡</div>
          </div>
          <div id="paymentNote" style="font-size:0.8rem; color:var(--text-muted);">貨物送達超商後，取貨時現場支付現金或刷卡。</div>
        </div>

        <button type="submit" class="btn-submit">確認協議並送出訂單</button>
      </form>
    </div>

  </div>

  <script>
    // 本地會員檔案系統 (LocalStorage)
    let memberProfile = JSON.parse(localStorage.getItem('guilty_member')) || null;

    function updateMemberUI() {
      const btn = document.getElementById('memberBtn');
      if(memberProfile && memberProfile.name) {
        btn.textContent = `[ 代號：${memberProfile.name} ]`;
        document.getElementById('custName').value = memberProfile.name || '';
        document.getElementById('custPhone').value = memberProfile.phone || '';
        document.getElementById('shippingLocation').value = memberProfile.lastLocation || '';
      }
    }

    function toggleMemberModal() {
      const name = prompt('請輸入嫌疑人代號 / 會員名稱：', memberProfile ? memberProfile.name : '');
      if(name) {
        const phone = prompt('請輸入聯絡終端電話：', memberProfile ? memberProfile.phone : '');
        memberProfile = { name, phone, lastLocation: memberProfile ? memberProfile.lastLocation : '' };
        localStorage.setItem('guilty_member', JSON.stringify(memberProfile));
        updateMemberUI();
        alert('【身份認證成功】已建立本地終端記憶。');
      }
    }

    // 商品與頁面邏輯
    const products = [
      { id: 'cat-choker', brandName: '欲室｜共犯 GUILTY', title: '【貓痕義體拘束項圈】', price: 2880, desc: 'SLS 尼龍外骨骼裝甲 × TPU 85A 肉球壓印' },
      { id: 'shushi-rope', brandName: 'shushi束室 繩教室', title: '【束室繩教室｜精煉麻繩組】', price: 1680, desc: '特級天然黃麻蜂蠟養護三本入' }
    ];

    let selectedProduct = products[0];
    let currentShipping = '7-11 超商取貨';
    let currentPayment = '超商取貨付款';

    function renderCatalog() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="product-card" onclick="goToCheckout('${p.id}')">
          <div class="card-thumb">[ ${p.title} 預覽圖 ]</div>
          <div class="card-body">
            <div style="font-size:0.75rem; color:var(--accent-cyan);">${p.brandName}</div>
            <div style="font-weight:bold; margin:4px 0;">${p.title}</div>
            <div style="color:var(--text-muted); font-size:0.8rem; margin-bottom:8px;">${p.desc}</div>
            <div style="color:var(--accent-cyan); font-weight:bold;">NT$ ${p.price.toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    function showView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${viewId}`).classList.add('active');
      window.scrollTo(0,0);
    }

    function goToCheckout(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('orderSummary').innerHTML = `
        <strong>裝備：</strong>${selectedProduct.title}<br>
        <strong>金額：</strong>NT$ ${selectedProduct.price.toLocaleString()}（免運費調用中）
      `;
      showView('checkout');
    }

    function selectShipping(type, el) {
      el.parentElement.querySelectorAll('.radio-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const label = document.getElementById('storeLabel');
      if(type === '711') {
        currentShipping = '7-11 超商取貨';
        label.textContent = '7-11 門市名稱 / 店號*';
      } else if(type === 'family') {
        currentShipping = '全家 超商取貨';
        label.textContent = '全家 門市名稱 / 店號*';
      } else {
        currentShipping = '黑貓 宅配到府';
        label.textContent = '收件詳細地址*';
      }
    }

    function selectPayment(type, el) {
      el.parentElement.querySelectorAll('.radio-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const note = document.getElementById('paymentNote');
      if(type === 'cod') {
        currentPayment = '超商取貨付款';
        note.textContent = '貨物送達超商後，取貨時現場支付現金或刷卡。';
      } else if(type === 'linepay') {
        currentPayment = 'LINE Pay';
        note.textContent = '送出訂單後將生成 LINE Pay 專屬支付憑證/QR Code。';
      } else {
        currentPayment = '信用卡線上刷卡';
        note.textContent = '透過安全加密金流通道完成線上扣款。';
      }
    }

    // 提交訂單（自動記憶會員並發送）
    document.getElementById('checkoutForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const orderData = {
        product: selectedProduct.title,
        price: selectedProduct.price,
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        engraving: document.getElementById('custEngraving').value || '無',
        shipping: currentShipping,
        location: document.getElementById('shippingLocation').value,
        payment: currentPayment,
        timestamp: new Date().toISOString()
      };

      // 更新會員記憶
      localStorage.setItem('guilty_member', JSON.stringify({
        name: orderData.name,
        phone: orderData.phone,
        lastLocation: orderData.location
      }));

      // ==========================================
      // 【後端串接點】可直接在此處發送至 Google Sheets 或老王的 LINE Notify
      // fetch('YOUR_GOOGLE_SCRIPT_URL', { method: 'POST', body: JSON.stringify(orderData) });
      // ==========================================

      alert(`【認罪訂單已生成】\n收件人：${orderData.name}\n物流：${orderData.shipping} (${orderData.location})\n支付：${orderData.payment}\n資料已加密存入終端庫。`);
      showView('catalog');
      updateMemberUI();
    });

    renderCatalog();
    updateMemberUI();
  </script>
</body>
</html>

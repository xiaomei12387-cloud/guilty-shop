<!DOCTYPE html>
<html class="dark" lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>欲室｜共犯 GUILTY // 先鋒賽博戰術終端</title>

  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#08090c" />

  <!-- Google Fonts: Space Grotesk, JetBrains Mono, Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#08090c",
            "surface-container-lowest": "#040507",
            "surface-container-low": "#0d0e13",
            "surface-container": "#13151b",
            "surface-container-high": "#1a1d25",
            "surface-container-highest": "#232732",
            "surface-bright": "#2e3341",
            "primary": "#00ff88",
            "primary-container": "rgba(0, 255, 136, 0.12)",
            "primary-fixed": "#60ff99",
            "on-primary": "#002b15",
            "secondary": "#dbb8ff",
            "secondary-container": "#3c1860",
            "on-surface": "#e3e5ec",
            "on-surface-variant": "#9ba1b0",
            "outline": "#2b303c",
            "outline-variant": "#1d212a",
            "error": "#ff4d6d",
            "error-container": "#4a0f1d"
          },
          fontFamily: {
            "display-lg": ["Space Grotesk", "sans-serif"],
            "headline-xl": ["Space Grotesk", "sans-serif"],
            "headline-md": ["Space Grotesk", "sans-serif"],
            "code-hud": ["JetBrains Mono", "monospace"],
            "micro-spec": ["JetBrains Mono", "monospace"],
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"]
          },
          boxShadow: {
            "hud-glow": "0 0 35px -5px rgba(0, 255, 136, 0.25)",
            "hud-glow-sm": "0 0 15px 0 rgba(0, 255, 136, 0.3)",
            "panel": "0 20px 50px -15px rgba(0, 0, 0, 0.85)"
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #060709;
      color: #e3e5ec;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }
    .cyber-bg {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .scanline {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 999;
      opacity: 0.6;
    }
    .corner-notch {
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .glass-tactical {
      background: rgba(13, 15, 20, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-tactical:hover {
      border-color: rgba(0, 255, 136, 0.25);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #060709; }
    ::-webkit-scrollbar-thumb { background: #1f242e; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff88; }

    /* ✦ 小字卡標題與標籤樣式 (Tag Pill Cards) */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.25);
      color: #00ff88;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      margin: 3px;
      transition: all 0.2s ease;
    }
    .tag-pill.active-limit {
      background: rgba(255, 51, 102, 0.08);
      border-color: rgba(255, 51, 102, 0.3);
      color: #ff3366;
    }

    /* ✦ Stitch 版商城專用：統一卡片與預覽圖大小 */
    #productGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: rgba(13, 15, 20, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .product-card:hover {
      border-color: rgba(0, 255, 136, 0.35);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
      transform: translateY(-2px);
    }
    .product-card .card-thumb {
      width: 100%;
      height: 200px;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .product-card .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .card-thumb img {
      transform: scale(1.05);
    }
    .product-card .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
  </style>

  <!-- 原有工具庫 (html2canvas, QR, Chart.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="cyber-bg selection:bg-primary selection:text-black min-h-screen relative flex flex-col justify-between text-sm antialiased">
<div class="scanline"></div>

  <!-- ========================================================================== -->

  <!-- ========================================================================== -->
  <header class="sticky top-0 z-50 w-full px-4 md:px-8 py-3 bg-[#08090c]/90 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-[1600px] mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showLandingView()">
        <span class="text-sm font-bold text-white tracking-wider">欲室｜共犯</span>

        <button id="nav-shop" class="px-4 py-1.5 text-zinc-400 hover:text-primary transition-colors rounded" onclick="openShopCatalogView()">裝備商城</button>

  <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 py-6 relative">

    <!-- 🌐 VIEW: 首頁大廳 -->
    <div id="view-landing" class="view-section active space-y-12 text-center py-20">

      <div class="flex justify-center gap-4">
        <button class="px-6 py-3 bg-[#00ff88] text-black font-bold rounded cursor-pointer" onclick="openShopCatalogView()">進入裝備商城</button>
        <button class="px-6 py-3 bg-surface-container text-[#00ff88] border border-[#00ff88] font-bold rounded cursor-pointer" onclick="openTrackerAppView()">開啟實踐終端</button>
      </div>

            <div class="grid grid-cols-2 gap-4" id="mainMetricsBoardGrid"></div>

        <!-- 側邊欄名片認證 (這裡的「編輯」按鈕會開啟小字卡即時編輯器) -->

          <div class="tactical-panel p-5 rounded-sm space-y-4 bg-surface-container-low border border-white/10">
            <div class="flex justify-between items-center pb-3 border-b border-white/10">
              <h3 class="text-sm font-extrabold text-white">特工名片認證</h3>

            <div>
              <div class="text-xs font-bold text-[#ff3366] mb-1">🛑 絕對雷點</div>

  <!-- ========================================================================== -->
  <!-- 3. 專屬彈窗：特工名片偏好與「探索中」即時勾選 & 自訂編輯器 -->
  <!-- ========================================================================== -->
  <div class="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4" id="dossierTagsModal" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); z-index:9999;">
    <div class="bg-[#13151b] border border-[#00ff88]/35 max-w-lg w-full p-6 rounded-xl space-y-4 font-mono text-xs relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-white/10">
        <h4 class="text-sm font-bold text-[#00ff88]">// 特工標籤小字卡與狀態編輯器</h4>
        <button class="text-zinc-400 hover:text-white cursor-pointer" onclick="closeDossierTagsModal()">✕</button>

          <div class="text-xs font-bold text-[#00ff88] mb-2 flex justify-between items-center">
            <span>✦ 偏好項目（含 🔍 探索中 狀態）</span>
          </div>
          <div id="modalPrefCheckboxContainer" class="flex flex-wrap gap-2 mb-2"></div>
          <!-- 自訂新增偏好輸入框 -->
          <div class="flex gap-2 mt-2">
            <input type="text" id="customPrefInput" placeholder="輸入自訂偏好項目..." class="flex-1 bg-black border border-zinc-700 p-2 text-white rounded text-xs outline-none focus:border-[#00ff88]">
            <button onclick="addCustomTagFromModal('pref')" class="px-3 bg-[#00ff88]/20 text-[#00ff88] border border-[#00ff88]/40 rounded cursor-pointer">＋ 新增</button>
          </div>
        </div>

        <!-- 雷點 -->
        <div class="pt-3 border-t border-white/10">
          <div class="text-xs font-bold text-[#ff3366] mb-2">🛑 絕對雷點</div>
          <div id="modalLimitCheckboxContainer" class="flex flex-wrap gap-2 mb-2"></div>
          <!-- 自訂新增雷點輸入框 -->
          <div class="flex gap-2 mt-2">
            <input type="text" id="customLimitInput" placeholder="輸入自訂雷點項目..." class="flex-1 bg-black border border-zinc-700 p-2 text-white rounded text-xs outline-none focus:border-[#ff3366]">
            <button onclick="addCustomTagFromModal('limit')" class="px-3 bg-red-950/40 text-red-400 border border-red-500/30 rounded cursor-pointer">＋ 新增</button>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-white/10">
        <button class="px-5 py-2 bg-[#00ff88] text-black font-bold rounded cursor-pointer" onclick="closeDossierTagsModal()">儲存並更新名片字卡</button>
      </div>
    </div>

  <!-- ========================================================================== -->
  <!-- 4. 載入 JavaScript 引擎 -->
  <!-- ========================================================================== -->
  <script src="./js/config.js?v=20260903"></script>
  <script src="./js/auth.js?v=20260903"></script>
  <script src="./js/shop.js?v=20260903"></script>
  <script src="./js/tracker.js?v=20260903"></script>

  <script>
    // 頁面開場動畫
    let introTimer = setTimeout(() => enterSite(), 2800);
    function enterSite() {
      clearTimeout(introTimer);
      const intro = document.getElementById('intro-screen');
      if (intro) {
        intro.style.opacity = "0";
        setTimeout(() => intro.style.display = "none", 700);
      }
    }

    function setActiveView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => {
        el.classList.remove('active', 'block');
        el.classList.add('hidden');
      });
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('active', 'block');
      }
      window.scrollTo(0, 0);
    }

    function showLandingView(push = true) {
      setActiveView('view-landing');
      if (push) history.pushState({ view: 'landing' }, '', '#landing');
    }

    function openShopCatalogView() {
      setActiveView('view-shop');
      if (typeof renderProductCards === 'function') renderProductCards();
      history.pushState({ view: 'shop' }, '', '#shop');
    }

    function openTrackerAppView() {
      setActiveView('view-tracker');
      if (typeof renderTrackerApp === 'function') renderTrackerApp();
      history.pushState({ view: 'tracker' }, '', '#tracker');
    }

    function openProfileDossierView() {
      setActiveView('view-dossier');
      if (typeof renderProfileDossier === 'function') renderProfileDossier();
      history.pushState({ view: 'dossier' }, '', '#dossier');
    }

    // ✦ 確保預設清單最前方擁有「🔍 探索中」
    if (typeof DEFAULT_PRESET_TAGS !== 'undefined') {
      if (!DEFAULT_PRESET_TAGS.preferences.includes("🔍 探索中")) {
        DEFAULT_PRESET_TAGS.preferences.unshift("🔍 探索中");
      }
    }

    // ✦ 點擊「編輯偏好與狀態」開啟名片小字卡編輯面板
    function openDossierTagsModal() {
      const modal = document.getElementById("dossierTagsModal");
      if (!modal) return;

      const prof = (typeof trackerState !== 'undefined' && trackerState.profile) ? trackerState.profile : { selectedTags: [], limits: [], allPreferences: [], allLimits: [] };
      
      const allPrefs = prof.allPreferences || (typeof DEFAULT_PRESET_TAGS !== 'undefined' ? DEFAULT_PRESET_TAGS.preferences : ["🔍 探索中", "重度SP"]);
      const allLimits = prof.allLimits || (typeof DEFAULT_PRESET_TAGS !== 'undefined' ? DEFAULT_PRESET_TAGS.hardLimits : []);
      const selPrefs = prof.selectedTags || [];
      const selLimits = prof.limits || [];

      // 渲染偏好勾選小字卡
      const prefContainer = document.getElementById("modalPrefCheckboxContainer");
      if (prefContainer) {
        prefContainer.innerHTML = allPrefs.map(t => `
          <label class="flex items-center gap-1 px-2.5 py-1 rounded bg-black border ${selPrefs.includes(t) ? 'border-[#00ff88] text-[#00ff88]' : 'border-zinc-800 text-zinc-400'} cursor-pointer text-xs">
            <input type="checkbox" value="${t}" ${selPrefs.includes(t) ? 'checked' : ''} onchange="toggleModalTag('pref', '${t}', this.checked)" style="accent-color:#00ff88;">
            <span>${t}</span>
          </label>
        `).join('');
      }

      // 渲染雷點勾選小字卡
      const limitContainer = document.getElementById("modalLimitCheckboxContainer");
      if (limitContainer) {
        limitContainer.innerHTML = allLimits.map(l => `
          <label class="flex items-center gap-1 px-2.5 py-1 rounded bg-black border ${selLimits.includes(l) ? 'border-[#ff3366] text-[#ff3366]' : 'border-zinc-800 text-zinc-400'} cursor-pointer text-xs">
            <input type="checkbox" value="${l}" ${selLimits.includes(l) ? 'checked' : ''} onchange="toggleModalTag('limit', '${l}', this.checked)" style="accent-color:#ff3366;">
            <span>${l}</span>
          </label>
        `).join('');
      }

      modal.style.display = "flex";
    }

    function closeDossierTagsModal() {
      const modal = document.getElementById("dossierTagsModal");
      if (modal) modal.style.display = "none";
      if (typeof renderProfileDossier === 'function') renderProfileDossier();
    }

    function toggleModalTag(type, tag, isChecked) {
      if (typeof trackerState === 'undefined' || !trackerState.profile) return;
      const prof = trackerState.profile;

      if (type === 'pref') {
        if (!prof.selectedTags) prof.selectedTags = [];
        if (isChecked && !prof.selectedTags.includes(tag)) {
          prof.selectedTags.push(tag);
        } else if (!isChecked) {
          prof.selectedTags = prof.selectedTags.filter(t => t !== tag);
        }
      } else {
        if (!prof.limits) prof.limits = [];
        if (isChecked && !prof.limits.includes(tag)) {
          prof.limits.push(tag);
        } else if (!isChecked) {
          prof.limits = prof.limits.filter(l => l !== tag);
        }
      }

      if (typeof saveTrackerState === 'function') saveTrackerState();
    }

    // ✦ 在編輯彈窗內直接自訂新增標籤
    function addCustomTagFromModal(type) {
      if (typeof trackerState === 'undefined' || !trackerState.profile) return;
      const prof = trackerState.profile;

      if (type === 'pref') {
        const input = document.getElementById("customPrefInput");
        const val = input.value.trim();
        if (!val) return;
        if (!prof.allPreferences) prof.allPreferences = [...(DEFAULT_PRESET_TAGS.preferences)];
        if (!prof.allPreferences.includes(val)) prof.allPreferences.push(val);
        if (!prof.selectedTags) prof.selectedTags = [];
        if (!prof.selectedTags.includes(val)) prof.selectedTags.push(val);
        input.value = "";
      } else {
        const input = document.getElementById("customLimitInput");
        const val = input.value.trim();
        if (!val) return;
        if (!prof.allLimits) prof.allLimits = [...(DEFAULT_PRESET_TAGS.hardLimits)];
        if (!prof.allLimits.includes(val)) prof.allLimits.push(val);
        if (!prof.limits) prof.limits = [];
        if (!prof.limits.includes(val)) prof.limits.push(val);
        input.value = "";
      }

      if (typeof saveTrackerState === 'function') saveTrackerState();
      openDossierTagsModal(); // 重新整理彈窗內的勾選清單
    }

    // ✦ 覆寫 tracker.js 中的名片字卡渲染，讓主畫面完美以「小字卡」呈現
    function renderDossierTags() {
      const prof = trackerState.profile;
      const prefBox = document.getElementById("myPrefTagsBox");
      const limitBox = document.getElementById("myLimitTagsBox");

      if (prefBox) {
        const selPrefs = prof.selectedTags || ["🔍 探索中", "重度SP"];
        prefBox.innerHTML = selPrefs.map(t => `<div class="tag-pill">${t}</div>`).join('');
      }

      if (limitBox) {
        const selLimits = prof.limits || [];
        limitBox.innerHTML = selLimits.map(l => `<div class="tag-pill active-limit">${l}</div>`).join('');
      }
    }

    function toggleCart(isOpen) {
      const drawer = document.getElementById("cartDrawer");
      const overlay = document.getElementById("navOverlay");
      if (!drawer) return;
      drawer.style.transform = isOpen ? "translateX(0)" : "translateX(100%)";
      if (overlay) overlay.classList.toggle("hidden", !isOpen);
    }

    // 初始化狀態
    history.replaceState({ view: 'landing' }, '', '#landing');
    if (typeof updateMemberUI === 'function') updateMemberUI();
    if (typeof updateCartUI === 'function') updateCartUI();
  </script>
</body>
</html>
